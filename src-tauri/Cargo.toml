[package]
name = "boymoder-ai-assistant"
version = "0.1.0"
description = "Boymoder AI Assistant - Desktop Pet Orchestrator"
authors = ["Boymoder AI Assistant"]
license = "MIT"
edition = "2021"

[lib]
name = "boymoder_ai_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
cairo-rs = "0.18"
libc = "0.2"
